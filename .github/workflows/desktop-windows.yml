name: Desktop Windows

# jpackage cannot make Windows packages from Linux, so a PC tag (yuma-pc-v*)
# builds the MSI and a portable zip here and adds them to that tag's release.
# The Linux .deb/.tar.gz are still built and released by hand. Android's
# release.yml listens to v* tags only and is not touched by this.
on:
  push:
    tags: ['yuma-pc-v*']
  workflow_dispatch:
    inputs:
      tag:
        description: PC release tag to build and attach to (e.g. yuma-pc-v1.1.1); empty = build only
        default: ''
        type: string

permissions:
  contents: write

concurrency:
  group: desktop-windows-${{ inputs.tag || github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    env:
      TAG: ${{ inputs.tag || (startsWith(github.ref, 'refs/tags/') && github.ref_name) || '' }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}

      # 21 runs Gradle; 17 is the toolchain desktop/build.gradle.kts asks for.
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: |
            17
            21

      - uses: gradle/actions/setup-gradle@v6

      # The app decodes every stream through ffmpeg; Windows has none, so a
      # static GPL build rides along in the app's resources.
      - name: Bundle ffmpeg
        run: |
          curl -fsSL -o ffmpeg.zip https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip
          unzip -q ffmpeg.zip
          mkdir -p desktop/appResources/windows
          cp ffmpeg-master-latest-win64-gpl/bin/ffmpeg.exe desktop/appResources/windows/
          desktop/appResources/windows/ffmpeg.exe -hide_banner -version | head -1

      # Smart Automix's analysis is the phone's C++ (app/src/main/cpp), built here as a DLL beside ffmpeg.
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Build yuma_analysis.dll
        shell: cmd
        run: |
          cl -nologo -O2 -std:c++20 -EHsc -LD -D_USE_MATH_DEFINES -Iapp\src\main\cpp\analyzer -I"%JAVA_HOME_17_X64%\include" -I"%JAVA_HOME_17_X64%\include\win32" app\src\main\cpp\analyzer\*.cpp app\src\main\cpp\jni\*.cpp -Fe:desktop\appResources\windows\yuma_analysis.dll
          if errorlevel 1 exit /b 1
          del desktop\appResources\windows\yuma_analysis.lib desktop\appResources\windows\yuma_analysis.exp 2>nul
          dir desktop\appResources\windows

      - name: Package
        run: ./gradlew :desktop:packageReleaseMsi :desktop:createReleaseDistributable --stacktrace

      - name: Name the packages
        run: |
          ver=$(grep -oP 'val desktopVersion = "\K[^"]+' desktop/build.gradle.kts)
          mkdir out
          cp desktop/build/compose/binaries/main-release/msi/*.msi "out/Square-Yuma-PC-$ver-windows-x64.msi"
          (cd desktop/build/compose/binaries/main-release/app && 7z a -tzip -bso0 "$GITHUB_WORKSPACE/out/Square-Yuma-PC-$ver-windows-x64.zip" square-yuma)
          ls -la out

      # The portable build has to come up and stay up; a crash at start ends the process.
      - name: Smoke test
        run: |
          app=desktop/build/compose/binaries/main-release/app/square-yuma
          find "$app" -iname 'ffmpeg.exe'
          test -f "$app/app/resources/ffmpeg.exe" # $APPDIR is app/ on Windows (lib/app on Linux)
          test -f "$app/app/resources/yuma_analysis.dll"
          # Native analysis and ONNX Runtime on Windows; the launcher has no console, so the result is a file too.
          "$app/square-yuma.exe" --self-check || true
          cat "$USERPROFILE/.square-yuma/self-check.txt"
          grep -q "self-check ok" "$USERPROFILE/.square-yuma/self-check.txt"
          "$app/square-yuma.exe" &
          sleep 25
          tasklist //FI "IMAGENAME eq square-yuma.exe" | grep -i square-yuma.exe
          taskkill //F //IM square-yuma.exe

      - uses: actions/upload-artifact@v7
        with:
          name: square-yuma-pc-windows
          path: out/*
          if-no-files-found: error

      # The release is created by hand right after the tag is pushed; wait for it.
      - name: Attach to release
        if: env.TAG != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for i in $(seq 1 30); do gh release view "$TAG" > /dev/null 2>&1 && break; sleep 20; done
          gh release upload "$TAG" out/* --clobber
