name: Desktop Windows & Linux Builds

on:
  push:
    tags: ['yuma-*', 'v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build Windows Executable & MSI Installer
        run: |
          .\gradlew.bat :desktopApp:packageMsi :desktopApp:packageExe :desktopApp:createDistributable :desktopApp:packageUberJarForCurrentOS --stacktrace

      - name: Collect Windows Binaries
        shell: bash
        run: |
          mkdir -p dist-windows
          find desktopApp/build/compose/binaries -type f \( -name "*.msi" -o -name "*.exe" \) -exec cp {} dist-windows/ \;
          cp desktopApp/build/compose/jars/*.jar dist-windows/ 2>/dev/null || true
          
          # Create standalone portable ZIP with bundled JRE and FFmpeg
          appDir=$(find desktopApp/build/compose/binaries/main/app -type d -name "Square-Yuma" 2>/dev/null | head -n 1)
          if [ -d "$appDir" ]; then
            echo "Creating Windows Portable ZIP from $appDir..."
            mkdir -p /tmp/ffmpeg-win
            curl -sSL "https://github.com/eugeneware/ffmpeg-static/releases/download/b6.1.1/ffmpeg-win32-x64.gz" -o /tmp/ffmpeg-win/ffmpeg.gz
            gzip -d /tmp/ffmpeg-win/ffmpeg.gz
            cp /tmp/ffmpeg-win/ffmpeg "$appDir/ffmpeg.exe" 2>/dev/null || true
            cp /tmp/ffmpeg-win/ffmpeg "$appDir/app/ffmpeg.exe" 2>/dev/null || true
            parentDir=$(dirname "$appDir")
            powershell.exe -Command "Compress-Archive -Path '$appDir' -DestinationPath 'dist-windows/Square-Yuma-1.1.1-Windows-Portable.zip' -Force"
          fi
          ls -la dist-windows/

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: square-yuma-windows-binaries
          path: dist-windows/

      - name: Upload to Release
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          tag="yuma-v1.1.1"
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            tag="${GITHUB_REF#refs/tags/}"
          fi
          for f in dist-windows/*; do
            if [ -f "$f" ]; then
              echo "Uploading $f to release $tag..."
              gh release upload "$tag" "$f" --clobber || true
            fi
          done

  build-linux-cross:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build Linux Packages
        run: |
          ./gradlew :desktopApp:packageDeb :desktopApp:packageAppImage :desktopApp:packageUberJarForCurrentOS --stacktrace

      - name: Collect Linux Binaries
        run: |
          mkdir -p dist-linux
          find desktopApp/build/compose/binaries -type f \( -name "*.deb" -o -name "*.AppImage" \) -exec cp {} dist-linux/ \;
          ls -la dist-linux/

      - name: Upload Linux Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: square-yuma-linux-binaries
          path: dist-linux/

      - name: Upload to Release
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="yuma-v1.1.1"
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            tag="${GITHUB_REF#refs/tags/}"
          fi
          for f in dist-linux/*; do
            if [ -f "$f" ]; then
              echo "Uploading $f to release $tag..."
              gh release upload "$tag" "$f" --clobber || true
            fi
          done

