name: Desktop Windows

# jpackage cannot make Windows packages from Linux, so a PC tag (yuma-pc-v*)
# builds the MSI and a portable zip here and attaches them to that tag's release.
# The Linux .deb/.tar.gz are still built and released by hand. Android's
# release.yml listens to v* tags only and is not touched by this.
on:
  push:
    tags: ['yuma-pc-v*']
  workflow_dispatch:
    inputs:
      tag:
        description: PC release tag to build and attach to (e.g. yuma-pc-v2.0.0); empty = build only
        default: ''
        type: string

permissions:
  contents: write

concurrency:
  group: desktop-windows-${{ inputs.tag || github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    env:
      TAG: ${{ inputs.tag || (startsWith(github.ref, 'refs/tags/') && github.ref_name) || '' }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}

      # 21 runs Gradle; 17 is the toolchain desktop/build.gradle.kts asks for.
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: |
            17
            21

      - uses: gradle/actions/setup-gradle@v6

      # Bungee is not checked into git (see app/build.gradle.kts bungeeTag = v2.4.24).
      - uses: actions/cache@v6
        with:
          path: native-dsp/bungee
          key: bungee-${{ hashFiles('app/build.gradle.kts') }}

      - name: Fetch Bungee
        run: |
          if [ ! -f native-dsp/bungee/bungee/Bungee.h ]; then
            rm -rf native-dsp/bungee
            mkdir -p native-dsp
            git clone --depth 1 --branch v2.4.24 --recurse-submodules --shallow-submodules \
              https://github.com/bungee-audio-stretch/bungee.git native-dsp/bungee
          fi

      # Build the native C++20 engine + analysis DLL (WASAPI, decoders, DSP, SMTC, JNI, static CRT).
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Build square_win_native.dll
        shell: cmd
        run: |
          set JAVA_HOME=%JAVA_HOME_17_X64%
          cmake -S native\windows -B native\windows\build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded
          if errorlevel 1 exit /b 1
          cmake --build native\windows\build
          if errorlevel 1 exit /b 1
          if not exist desktop\appResources\windows mkdir desktop\appResources\windows
          copy /Y native\windows\build\square_win_native.dll desktop\appResources\windows\square_win_native.dll
          if errorlevel 1 exit /b 1
          dir desktop\appResources\windows

      - name: Native CTest
        shell: cmd
        run: |
          ctest --test-dir native\windows\build --output-on-failure
          if errorlevel 1 exit /b 1

      - name: Desktop unit tests
        run: ./gradlew :desktop:test --stacktrace --console=plain

      - name: Package
        run: ./gradlew :desktop:packageReleaseMsi :desktop:createReleaseDistributable --stacktrace --console=plain

      - name: Name the packages
        run: |
          ver=$(grep -oP 'val desktopVersion = "\K[^"]+' desktop/build.gradle.kts)
          mkdir -p out
          cp desktop/build/compose/binaries/main-release/msi/*.msi "out/Square-Yuma-PC-$ver-windows-x64.msi"
          (cd desktop/build/compose/binaries/main-release/app && 7z a -tzip -bso0 "$GITHUB_WORKSPACE/out/Square-Yuma-PC-$ver-windows-x64.zip" square-yuma)
          ls -la out
          sha256sum out/*

      # The portable build has to verify native DSP/ONNX/analysis and stay up without crashing.
      # Note: `--soak-test` is skipped on headless Windows CI runners because they lack a WASAPI audio
      # endpoint, an interactive WDDM/D3D/tray desktop session, and Linux `/proc/self/statm` RSS reporting.
      - name: Smoke test
        run: |
          set -euo pipefail
          app=desktop/build/compose/binaries/main-release/app/square-yuma
          test -f "$app/app/resources/square_win_native.dll"
          "$app/square-yuma.exe" --self-check
          cat "$USERPROFILE/.square-yuma/self-check.txt"
          grep -q "self-check ok" "$USERPROFILE/.square-yuma/self-check.txt"
          "$app/square-yuma.exe" &
          sleep 25
          tasklist //FI "IMAGENAME eq square-yuma.exe" | grep -i square-yuma.exe
          taskkill //F //IM square-yuma.exe

      - uses: actions/upload-artifact@v7
        with:
          name: square-yuma-pc-windows
          path: out/*
          if-no-files-found: error

      # The release is created by hand right after the tag is pushed; wait for it.
      - name: Attach to release
        if: env.TAG != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for i in $(seq 1 30); do gh release view "$TAG" > /dev/null 2>&1 && break; sleep 20; done
          gh release upload "$TAG" out/* --clobber
